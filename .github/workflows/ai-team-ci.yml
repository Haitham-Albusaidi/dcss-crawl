name: AI Team Multi-Agent CI

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - '.ai-team/**'
      - '.github/workflows/ai-team-ci.yml'
  pull_request:
    branches:
      - main
      - 'feature/**'
    paths:
      - '.ai-team/**'
      - '.github/workflows/ai-team-ci.yml'

jobs:
  test-ai-team:
    name: Run Multi-Agent System Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure Git for tests
        run: |
          git config --global user.name "AI Team CI"
          git config --global user.email "ai-team-ci@crawl.local"

      - name: Run Antigravity Unit Tests
        run: |
          python -m unittest discover -s .ai-team/tests -v

      - name: Run Coordinator Workflow Tests
        run: |
          python .ai-team/test_coordinator.py
